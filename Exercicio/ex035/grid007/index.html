<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.pai {
            border: 3px solid rgb(50, 205, 205);
            display: grid;
            grid-template: repeat(7, 100px) / repeat(5, 1fr);
            gap: 5px;
            
    
        }

        div.caixa1 {
            background-color: lightgreen;
            grid-row: 1 / 2;
            grid-column: 1 / span 4;
            

        }
        div.caixa2 {
            background-color: yellowgreen;
            grid-row: 2 / span 2;
            grid-column: 1 / 3;
        }
        div.caixa3{
            background-color: yellow;
            grid-row: 2 / span 2;
            grid-column: 3 / 5;
        }
        div.caixa4 {
            background-color: rgb(6, 255, 193);
            grid-row: 1 / span 7;
            grid-column: 5 / 6;
        }
        div.caixa5{
            background-color: blueviolet;
            grid-row: 4/ span 4;
            grid-column: 1 / 2;
        }
        div.caixa6{
            background-color: lightpink;
            grid-row: 4/ span 4;
            grid-column: 2 / span 3;
        }

    </style>
</head>
<body>
    <div class="pai">
        <div class="caixa1">Caixa 1</div>
        <div class="caixa2">Caixa 2</div>
        <div class="caixa3">Caixa 3</div>
        <div class="caixa4">Caixa 4</div>
        <div class="caixa5">Caixa 5</div>
        <div class="caixa6">Caixa 6</div>
        
    </div>
    
</body>
</html>
