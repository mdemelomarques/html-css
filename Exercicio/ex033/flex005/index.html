<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização Absoluta Flexbox</title>
    <style>
        body{
            background-color: azure;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
            
            
        }
        main {
            background-color: darkseagreen;
            height: 50vh;
            width: 50vw;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        section {
            background-color: hotpink;
            height: 250px;
            width: 250px;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>
                Centralizado
            </h1>
        </section>
    </main>
    
</body>
</html>
