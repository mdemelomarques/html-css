<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div#pai {
            background-color: green;
            display: flex;
            text-align: center;
            flex-flow: row nowrap;
        }

        div.filho{
            background-color: greenyellow;
            border: 1px solid black;
            flex-basis: 200px;
        }
        div#filho1{
            flex-grow: 1;
            flex-shrink: 1;
        }

        div#filho2{
            flex-grow: 1;
            flex-shrink: 2;

        }


        div#filho3{
            flex-grow: 1;
            flex-shrink: 4;

        }
    </style>
</head>
<body>
    <div id="pai">
        <div class="filho" id="filho1">1</div>
        <div class="filho" id="filho2">2</div>
        <div class="filho" id="filho3">3</div>
        
    </div>
</body>
</html>
