<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Basis</title>
    <style>
        div#pai {
            background-color: green;
            display: flex;
            text-align: center;
            flex-flow: row wrap;
            height: 600px;
            align-content: center;
        }

        div.filho{
            background-color: greenyellow;
            border: 1px solid black;
            flex-basis: 250px;
            
        }
    </style>
</head>
<body>
    <div id="pai">
        <div class="filho">Aumentei o texto da div 1</div>
        <div class="filho">2</div>
        <div class="filho">Aumentei mais ainda o texto da div 3</div>
        <div class="filho">4</div>
        <div class="filho">A div 5 vai ficar beeeeeeeeeeeeeeeeeem grande</div>
        <div class="filho">Essa é a div 6</div>
        <div class="filho">Div 7 aqui</div>
    </div>
</body>
</html>
