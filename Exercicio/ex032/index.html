<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilos/mobile.css" media="all">
    <link rel="stylesheet" href="estilos/tablet.css" media="screen and (min-width: 768px) and (max-width: 992px)">
    <link rel="stylesheet" href="estilos/desktop.css" media="screen and (min-width: 992px)">

</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>Área De Login</h1>
                <p>Seja bem vindo(a) coloque seus dados de acesso para entrar em sua conta:</p>
                <form action="login.php" method="post" id="form">
                    <div class="campo">
                        <label for="isenha"><span class="material-symbols-outlined">alternate_email</span></label>
                        <input type="email" name="senha" id="isenha" placeholder="Seu E-mail" autocomplete="email" required>
                    </div>
                    
                    <div class="campo">
                        <label for="isenha"><span class="material-symbols-outlined">key</span></label>
                        <input type="password" name="senha" id="isenha" placeholder="Sua Senha" autocomplete="current-password" required minlength="5">
                    </div>
                    
                    <input type="submit" value="Entrar">
                    <a href="esqueci.html" class="botao">Esqueceu a Senha?<span class="material-symbols-outlined">mail_lock</span></a>
                </form>

            </div>
        </section>
