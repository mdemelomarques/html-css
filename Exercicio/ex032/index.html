<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/mobile.css" media="all">
    <link rel="stylesheet" href="estilos/tablet.css" media="screen and (min-width: 768px) and (max-width: 992px)">
    <link rel="stylesheet" href="estilos/desktop.css" media="screen and (min-width: 992px)">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=key,person" />
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>Área De Login</h1>
                <p>Seja bem vindo(a) coloque seus dados de acesso para entrar em sua conta</p>
                <form action="" method="post">
                    <label for="inome"><span class="material-symbols-outlined">person</span></label>
                        <input type="text" name="nome" id="inome">
                    
                    <br>
                    <label for="isenha"><span class="material-symbols-outlined">key</span></label>
                        <input type="password" name="senha" id="isenha">
                    
                        <input type="submit" value="Entrar">
                </form>

            </div>
        </section>
    </main>
    
</body>
</html>
