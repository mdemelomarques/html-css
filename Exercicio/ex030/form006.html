<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Outputs</h1>
    <form action="" method="get">

        <fieldset>
            <legend>Exercício 1</legend>
            <p>
                <label for="inum1">Primeiro Número</label>
                <input type="number" name="num1" id="inum1" min="0" max="50" required
                oninput="isoma.innerHTML = Number(num1.value) + Number(num2.value)">
            </p>
            
            <p>
                <label for="inum2">Segundo Número</label>
                <input type="number" name="num2" id="inum2" min="0" max="50" required
                oninput="isoma.innerHTML = Number(num1.value) + Number(num2.value)">
            </p>
            <p>
                <label for="isoma">Soma:</label>
                <output name="soma" id="isoma">0</output>
            </p>
        </fieldset>
        <fieldset>
            <legend>Exercicio 2</legend>
            <p>
                <label for="iran">Barra de Rolagem:</label>
                <input type="range" name="ran" id="iran" value="60" oninput="iout.innerHTML = Number(iran.value)">
                <output name="out" id="iout"></output>
            </p>
        </fieldset>
        <fieldset>
            <legend>Exercicio 03</legend>
            <p>
                <label for="iyear">Ano de Nascimento:</label>
                <input type="number" name="year" id="iyear" min="1930" max="2025"
                oninput="calcAni()">
            </p>
            <p>
                <label for="idade">Você tem essa idade:</label>
                <output id="idade">0</output>
            </p>
           
        </fieldset>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>

    <script>
        function calcAni() {
            let atual = new Date() .getFullYear()
            idade.innerHTML = Number(atual) - Number(iyear.value)
        }
    </script>
</html>
