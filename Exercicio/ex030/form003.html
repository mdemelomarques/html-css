<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="get">

        <fieldset>
            <legend>
                Prontuário Médico
            </legend>
            <p>
                <label for="itelefone">Telefone:</label>
                <input type="tel" name="telefone" id="itelefone">
            </p>
            <p>
                <label for="ie-mail">E-Mail:</label>
                <input type="email" name="e-mail" id="ie-mail">
            </p>
            <p>
               <label for="inome">Nome de Usuário:</label>
               <input type="text" name="nome" id="inome" required minlength="5" maxlength="15" size="15" autocomplete="username" placeholder="Nome Aqui">
            </p>
             <p>
               <label for="isenha">Senha:</label>
               <input type="password" name="senha" id="isenha" required minlength="3" maxlength="10" size="10" autocomplete="new-password" placeholder="Senha Aqui">
            </p>
            <p>
                <label for="inum">Número de Protocolo:</label>
                <input type="number" name="num" id="inum" step="0.1" size="5" placeholder="N de Protocolo">
            </p>
            <p>
                <label for="imes">Mês da última Consulta:</label>
                <input type="month" name="mes" id="imes" value="Fevereiro">
            </p>
            <p>
                <label for="idata">Data de Adesão ao Plano:</label>
                <input type="date" name="data" id="idata">
            </p>
            <p>
                <label for="ihora">Hora Desejada para consulta:</label>
                <input type="time" name="hora" id="ihora">
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
