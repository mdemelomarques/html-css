<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="imas" value="M"><label for="imas">Masculino</label><br>
            <input type="radio" name="sexo" id="ifem" value="F"><label for="ifem">Feminino</label><br>
            <input type="radio" name="sexo" id="ioutro" value="O"><label for="ioutro">Outro</label><br>
            <input type="radio" name="sexo" id="indizer" value="ND"><label for="indizer">Prefiro Não Dizer</label><br>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="basq" id="ibasq"><label for="ibasq">Basquete</label><br>
            <input type="checkbox" name="fute" id="ifute"><label for="ifute">Futebol</label><br>
            <input type="checkbox" name="xad" id="ixad"><label for="ixad">Xadrez</label><br>
            <input type="checkbox" name="corrida" id="icorrida"><label for="icorrida">Corrida</label><br>
            <input type="checkbox" name="golf" id="igolf"><label for="igolf">Golf</label><br>
        </fieldset>
        <input type="submit" value="Enviar Dados">
        <input type="reset" value="Limpar Tudo">
    </form>
</body>
</html>
