<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        
        }
    </style>
</head>
<body>
    <h1>Meu Primeiro Formulário</h1>
    <form>
        <p><label for="inome">Nome:</label> <input type="text" name="nome" id="inome"></p>
        <p><label for="isobrenome">Sobrenome:</label> <input type="text" name="sobrenome" id="isobrenome"></p>
        <p><label for="itelefone">Telefone:</label> <input type="tel" name="telefone" id="itelefone"></p>
        <p><label for="ie-mail">E-Mail:</label> <input type="email" name="e-mail" id="ie-mail"></p>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
